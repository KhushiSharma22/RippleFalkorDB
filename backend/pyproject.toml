[project]
name = "ripple"
version = "0.1.0"
description = "Evidence-driven inspection robot that prevents cascading equipment failures"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
# cyberwave = ["<sdk package name — confirm in Step 0.2>"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ripple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running FalkorDB",
    "scenario: end-to-end scenario run",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
